<script>

const T = THREE;
const ls = (k, d) => { try { const v = JSON.parse(localStorage.getItem('bg3d_' + k)); return v == null ? d : v; } catch (e) { return d; } };

let friends = ls('f', []), myName = ls('n', 'Player' + (1000 + Math.random() * 9000 | 0)), myColor = ls('c', '#1e88e5'), rec = ls('rec', {});
lset('n', myName);
const GR = 26, JUMP = 10, SP = 8, PW = .35, PH = 1.85;
const R = new T.WebGLRenderer({antialias: true}); R.setPixelRatio(Math.min(devicePixelRatio, 1.5)); R.shadowMap.enabled = true; R.shadowMap.type = T.PCFSoftShadowMap; R.toneMapping = T.ACESFilmicToneMapping; R.toneMappingExposure = 1.1;

  gr.addColorStop(0, '#2f7fe0'); gr.addColorStop(.6, '#7ec8ff'); gr.addColorStop(1, '#d9f0ff'); x.fillStyle = gr; x.fillRect(0, 0, 2, 256); sc.background = new T.CanvasTexture(c); })();

const cam = new T.PerspectiveCamera(65, 1, .1, 300);

const sun = new T.DirectionalLight(0xfff2dd, .95); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024); sun.shadow.bias = -.0004;

// ===== Утилиты =====

let ac;

  if (!o.lava && !o.mv && !o.tile && w >= 2 && d >= 2) SD.push([x, y + h / 2, z, w, d, c]);

const SG = new T.CylinderGeometry(.28, .28, .14, 10);

  }

const PT = [];
for (let i = 0; i < 40; i++) { const m = new T.Mesh(BG, new T.MeshBasicMaterial({color: 0xffffff})); m.visible = false; sc.add(m); PT.push({m, v: new T.Vector3(), l: 0}); }

  for (const q of PT) { if (q.l > 0) continue; q.l = .5 + Math.random() * .3; q.m.visible = true; q.m.material.color.set(c); q.m.position.copy(p); q.v.set((Math.random() - .5) * 5, Math.random() * 5 + 1, (Math.random() - .5) * 5); if (++k >= n) break; }
}
function pt(dt) { for (const q of PT) if (q.l > 0) { q.l -= dt; q.v.y -= 14 * dt; q.m.position.addScaledVector(q.v, dt); q.m.scale.setScalar(Math.max(.01, q.l * .3)); if (q.l <= 0) q.m.visible = false; } }

  const m = new T.Mesh(BG, mat('#ffd600')); m.scale.set(.55, .55, .15); m.position.set(x, y, z); L.add(m); Cn.push({m, y, x, z});
}

  for (let k = 0; k < n; k++) {
    const a = k * .6, x = Math.cos(a) * 9, z = Math.sin(a) * 9, last = goal && k === n - 1, cp = goal && k % 6 === 0;
    box(x, k - .5, z, last ? 6 : 3.2, 1, last ? 6 : 3.2, last ? '#ffd600' : cp ? '#2e7d32' : COL[k % 6], {goal: last, cp});
    if (k % 4 === 2) coin(x, k + 1.2, z);
  }
  st.cp.set(9, 0, 0);

// ===== Игры =====
const G = [
  {e: '🌋', n: 'Obby 3D', d: 'Доберись до золотого финиша', s() {
    box(0, -.5, 0, 8, 1, 8, '#78909c'); st.cp.set(0, 0, 0);
    box(0, -8, -80, 200, 1, 260, 0, {lava: 1});
    for (let i = 1; i <= 30; i++) {
      const x = Math.sin(i * .8) * 2, y = i * .25, z = -i * 5.2, fin = i === 30, cp = i % 6 === 0 && !fin;
      box(x, y - .5, z, fin ? 7 : 3, 1, fin ? 7 : 3, fin ? '#ffd600' : cp ? '#2e7d32' : COL[i % 6], {goal: fin, cp, mv: i % 5 === 3 ? {a: 'x', amp: 2, sp: 1.3} : 0});
      if (i % 3 === 0 && !fin) coin(x, y + 1.2, z);
    }
  }},
  {e: '🪙', n: 'Coin Rush', d: '20 монет за 60 секунд', lim: 60, collect: 1, s() {
    box(0, -.5, 0, 44, 1, 44, '#5c6bc0'); st.cp.set(0, 0, 0);
    for (let i = 0; i < 6; i++) { const a = i * 1.047 + .52; box(Math.cos(a) * 11, 1, Math.sin(a) * 11, 3, 2, 3, COL[i]); }

    st.need = Cn.length;
  }},
  {e: '🏔️', n: 'Sky Tower', d: 'Взберись на вершину башни', s() { spiral(40, 1); }},
  {e: '🔥', n: 'Lava Rise', d: 'Лава поднимается: выживи 60 с', lim: 60, survive: 1, hard: 1, s() {

  {e: '☄️', n: 'Dodge', d: 'Уворачивайся от блоков 40 с', lim: 40, survive: 1, hard: 1, s() {

  }, u(dt) {
    st.f -= dt;
    if (st.f <= 0) {
      st.f = Math.max(.12, .5 - st.t * .009);
      const x = (Math.random() < .5 ? P.x : 0) + (Math.random() - .5) * 16, z = (Math.random() < .5 ? P.z : 0) + (Math.random() - .5) * 16;
      const m = new T.Mesh(BG, mat('#e53935')); m.scale.set(2, 2, 2); m.position.set(x, 28, z);

// ===== Игрок =====
const me = new T.Group(); sc.add(me);
